{% extends "base.html" %}

{% block page_content %}
<div class="page-header">
  <h1>Chat with the bot, {{ name }}!</h1>
</div>

<div id="chatlog" style="min-height:200px; border:1px solid #ddd;
     padding:10px; margin-bottom:10px;"></div>

<div class="input-group">
  <input type="text" id="message" class="form-control"
         placeholder="Type a message...">
  <span class="input-group-btn">
    <button id="send" class="btn btn-primary" type="button">Send</button>
  </span>
</div>

<br>
<a class="btn btn-default" href="{{ url_for('logout') }}">Logout</a>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
  const log = document.getElementById('chatlog');
  const input = document.getElementById('message');

  function addLine(who, text) {
    const p = document.createElement('p');
    p.textContent = who + ': ' + text;
    log.appendChild(p);
  }

  async function send() {
    const message = input.value.trim();
    if (!message) return;
    addLine('You', message);
    input.value = '';
    const res = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: message})
    });
    const data = await res.json();
    addLine('Bot', data.reply);
  }

  document.getElementById('send').addEventListener('click', send);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
{% endblock %}
